services:
  mariadb:
    image: mariadb:11
    container_name: coinvane-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coinvane-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./Backend
    container_name: coinvane-api
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
      redis:   { condition: service_healthy }
    environment: &backend_env
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Plaid — set PLAID_ENABLED=false (or leave client id/secret blank)
      # to run Coinvane as a manual-only budgeting app. When disabled,
      # the frontend hides every Plaid affordance and the backend 404s
      # every /api/plaid/* route.
      PLAID_ENABLED: ${PLAID_ENABLED:-}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: ${PLAID_ENV}
      PLAID_REDIRECT_URI: ${PLAID_REDIRECT_URI}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Explicit on/off switch for Google. Blank = derive from client id
      # (on if set, off if blank). "false" hides the button even when
      # the client id is set — useful for temporary lockdown.
      GOOGLE_SSO_ENABLED: ${GOOGLE_SSO_ENABLED:-}
      # Microsoft Sign-In (Entra ID + personal MSA). Blank = feature
      # hidden on the login page. See .env.example for the app-
      # registration walkthrough and the full control-var reference.
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      # Explicit on/off switch. Blank = derive from client id (on if
      # set, off if blank). "false" hides the button even when the
      # client id is set — useful for temporarily disabling.
      MICROSOFT_SSO_ENABLED: ${MICROSOFT_SSO_ENABLED:-}
      # Tenant scope: common | consumers | organizations | <guid>
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      # Optional redirect URI override. Blank = frontend derives it
      # from window.location.origin + "/auth".
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_URL: ${APP_URL}
      EMAIL_CONFIG: ${EMAIL_CONFIG}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SIGNUP_MODE: ${SIGNUP_MODE}
      # Sign in with a one-time link. Disabled by default; requires
      # EMAIL_CONFIG=enabled + SMTP configured to actually send. See
      # .env.example for full docs.
      ONE_TIME_LINK_ENABLED: ${ONE_TIME_LINK_ENABLED:-false}
      ONE_TIME_LINK_STRICT_IP: ${ONE_TIME_LINK_STRICT_IP:-true}
      # Worker-only: how often Plaid is polled, in minutes. The backend
      # ignores it. Default in code is 60. See .env.example for guidance.
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-60}
      # Web Push VAPID keys. Empty = push silently disabled. Generate
      # with `npx web-push generate-vapid-keys`.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      # Receipt attachments — shared with worker so both can read/write
      # (worker only reads today, but we future-proof).
      - attachments_data:/data/attachments
    ports:
      - "127.0.0.1:4000:4000"

  worker:
    build: ./Backend
    container_name: coinvane-worker
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
      redis:   { condition: service_healthy }
    command: ["node", "src/worker.js"]
    environment: *backend_env
    volumes:
      - attachments_data:/data/attachments

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        # Optional: bakes the Microsoft client id into the built bundle
        # as a fallback for the /auth/public-config runtime fetch.
        VITE_MICROSOFT_CLIENT_ID: ${VITE_MICROSOFT_CLIENT_ID:-}
        # Optional build-time override for the MSAL redirect URI.
        # Runtime value from /auth/public-config wins if the backend
        # sends one. Handy for air-gapped builds.
        VITE_MICROSOFT_REDIRECT_URI: ${VITE_MICROSOFT_REDIRECT_URI:-}
    container_name: coinvane-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Bind to localhost only. A reverse proxy (Caddy/nginx) on the host
      # terminates HTTPS and proxies 443 → 127.0.0.1:8080. If you want this
      # publicly accessible WITHOUT a reverse proxy, change to "8080:80".
      - "127.0.0.1:8080:80"

volumes:
  mariadb_data:
  redis_data:
  attachments_data:
